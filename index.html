<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>404:DT — Официальные ресурсы</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
      outline: none;
    }

    :root {
      --bg-void: #040507;
      --steel-base: #0c0e12;
      --steel-panel: #11141a;
      --steel-border: rgba(180, 200, 220, 0.14);
      --steel-glow: rgba(140, 175, 215, 0.22);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse 90% 45% at 50% -10%, rgba(130, 160, 200, 0.16) 0%, transparent 70%),
        radial-gradient(circle 420px at 50% 105%, rgba(25, 32, 45, 0.8) 0%, transparent 65%),
        linear-gradient(180deg, #07090d 0%, #030406 100%);
      min-height: 100vh;
      color: #e6edf5;
      padding-top: max(1.2rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      letter-spacing: -0.015em;
    }

    /* Subtle carbon micro-texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
      z-index: -2;
      opacity: 0.55;
    }

    /* Armor Glass Card with brushed titanium rim */
    .titanium-glass {
      position: relative;
      background: linear-gradient(180deg, rgba(23, 27, 36, 0.72) 0%, rgba(10, 13, 18, 0.82) 100%);
      backdrop-filter: blur(36px) saturate(160%);
      -webkit-backdrop-filter: blur(36px) saturate(160%);
      border: 1px solid var(--steel-border);
      box-shadow: 
        0 32px 70px -15px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 1px 1px 0 rgba(220, 235, 255, 0.22),
        inset 0 -1px 2px 0 rgba(0, 0, 0, 0.8);
    }

    /* Pure Logo Container without Card Box (Float & Glow) */
    .custom-logo-badge {
      position: relative;
      width: 100%;
      animation: floatBadge 5s ease-in-out infinite;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .custom-logo-badge img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.85));
      background: transparent !important;
    }

    /* Ambient Pulsating Halo */
    .custom-logo-badge::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 20px;
      background: radial-gradient(ellipse at center, rgba(160, 200, 255, 0.18) 0%, rgba(90, 130, 185, 0.04) 50%, transparent 75%);
      filter: blur(16px);
      z-index: -1;
      animation: pulseGlow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Metallic Buttons matched to titanium plate */
    .metal-row {
      position: relative;
      background: linear-gradient(180deg, rgba(30, 36, 48, 0.55) 0%, rgba(13, 16, 22, 0.7) 100%);
      border: 1px solid rgba(170, 195, 225, 0.12);
      box-shadow: 
        0 6px 20px -4px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 0 rgba(230, 242, 255, 0.12),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.6);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .metal-row::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 0%, rgba(200, 225, 255, 0.14), transparent 75%);
      opacity: 0;
      transition: opacity 0.28s ease;
      pointer-events: none;
    }

    .metal-row:hover::before {
      opacity: 1;
    }

    .metal-row:active {
      transform: scale(0.985);
      border-color: rgba(205, 230, 255, 0.25);
      background: linear-gradient(180deg, rgba(40, 50, 68, 0.7) 0%, rgba(16, 20, 28, 0.85) 100%);
    }

    /* 3D Titanium Icon Tiles */
    .metal-icon-tile {
      background: linear-gradient(145deg, rgba(60, 72, 92, 0.45) 0%, rgba(18, 22, 30, 0.85) 100%);
      border: 1px solid rgba(210, 230, 255, 0.2);
      box-shadow: 
        0 8px 16px -2px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 2px 0 rgba(0, 0, 0, 0.7);
    }

    /* Brushed Chrome Beveled Support Banner */
    .metal-support-tint {
      background: linear-gradient(135deg, rgba(45, 62, 88, 0.38) 0%, rgba(18, 24, 34, 0.65) 100%);
      border: 1px solid rgba(150, 195, 245, 0.24);
      box-shadow: 
        0 6px 24px -4px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px 0 rgba(230, 245, 255, 0.22);
      position: relative;
      overflow: hidden;
    }

    .metal-support-tint::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
      animation: bannerShimmer 5.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes floatBadge {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-3px) scale(1.008);
      }
    }

    @keyframes pulseGlow {
      0% {
        opacity: 0.35;
        transform: scale(0.97);
      }
      100% {
        opacity: 0.75;
        transform: scale(1.03);
      }
    }

    @keyframes bannerShimmer {
      0% { transform: translateX(-100%); }
      22%, 100% { transform: translateX(100%); }
    }

    @keyframes techFadeIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .anim-tech {
      animation: techFadeIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="flex flex-col justify-center items-center px-4">

        <!-- 2. YouTube -->
        <a href="https://youtube.com/@404dt?si=U_6i1A5v9VwdPGXH" target="_blank" rel="noopener noreferrer" class="metal-row rounded-2xl flex items-center justify-between p-3">
          <div class="flex items-center gap-3">
            <span class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 metal-icon-tile">

                <path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/>

        <a href="http://www.tiktok.com/@404_dt" target="_blank" rel="noopener noreferrer" class="metal-row rounded-2xl flex items-center justify-between p-3">

              <svg viewBox="0 0 24 24" fill="none" stroke="#e0ecf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 filter drop-shadow-[0_0_6px_rgba(255,255,255,0.7)]">

            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-white/35 mr-1"></i>

        <!-- 4. Instagram -->
        <a href="https://instagram.com/404.dt?vrfl=MXU4aXozODI2eWpwMA%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" class="metal-row rounded-2xl flex items-center justify-between p-3">
          <div class="flex items-center gap-3">

              <svg viewBox="0 0 24 24" fill="none" stroke="#e0ecf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 filter drop-shadow-[0_0_6px_rgba(255,255,255,0.7)]">

      <!-- Нижняя панель действий -->

        <button id="share-or-copy" type="button" class="metal-row rounded-xl px-2.5 py-2.5 flex items-center justify-center gap-1.5 text-xs font-semibold text-zinc-300 text-center">

  <!-- Модальное окно с QR-кодом -->
  <div id="qrModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-xl flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div id="qrCard" class="bg-[#0b0e13] border border-white/20 w-full max-w-xs rounded-[28px] p-6 text-center shadow-[0_25px_60px_rgba(0,0,0,0.95)] transform scale-95 transition-transform duration-300">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-white text-sm tracking-tight">QR-код визитки</h3>
        <button id="close-qr" class="p-1 rounded-full text-zinc-400 hover:text-white">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      
      <div class="bg-white p-3 rounded-2xl inline-block shadow-inner mb-3">
        <img id="qrImage" src="" alt="QR Code" class="w-44 h-44 object-contain rounded-lg">
      </div>

      <p class="text-[11px] text-zinc-400">Наведите камеру смартфона для быстрого перехода ко всем ресурсам 404:DT</p>
    </div>
  </div>

  <!-- Всплывающее уведомление -->
  <div id="copy-toast" class="fixed bottom-7 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-[#10141c]/95 backdrop-blur-md text-white border border-white/20 shadow-2xl px-5 py-2.5 rounded-full text-xs font-medium transform translate-y-12 opacity-0 transition-all duration-300 pointer-events-none">
    <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
    <span id="toast-text">Ссылка скопирована</span>
  </div>

  <input type="text" id="clipboardInput" class="sr-only" aria-hidden="true" value="" />

  <script>
    lucide.createIcons();

    let toastTimer;
    const toast = document.getElementById('copy-toast');
    const toastText = document.getElementById('toast-text');

    function showToast(message) {
      if (message) toastText.textContent = message;
      clearTimeout(toastTimer);
      toast.classList.remove('translate-y-12', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 2200);
    }

    function getShareUrl() {
      return window.location.href.split('#')[0];
    }

    function execCopy(text) {
      const input = document.getElementById('clipboardInput');
      input.value = text;
      input.select();
      document.execCommand('copy');
      showToast('Ссылка скопирована');
    }

    function shareOrCopy() {
      const url = getShareUrl();
      const shareData = {
        title: '404:DT — Официальные ресурсы',
        text: 'Все официальные платформы канала 404:DT в одной визитке:',
        url: url
      };

      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        navigator.share(shareData).catch((err) => {
          if (err.name !== 'AbortError') {
            copyUrlFallback(url);
          }
        });
      } else {
        copyUrlFallback(url);
      }
    }

    function copyUrlFallback(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => showToast('Ссылка скопирована'))
          .catch(() => execCopy(url));
      } else {
        execCopy(url);
      }
    }

    document.getElementById('share-or-copy').addEventListener('click', shareOrCopy);

    const qrModal = document.getElementById('qrModal');
    const qrCard = document.getElementById('qrCard');
    const qrImg = document.getElementById('qrImage');

    document.getElementById('show-qr').addEventListener('click', () => {
      const currentUrl = getShareUrl();
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(currentUrl)}&color=08090d`;
      qrModal.classList.remove('hidden');
      setTimeout(() => {
        qrModal.classList.remove('opacity-0');
        qrCard.classList.remove('scale-95');
        qrCard.classList.add('scale-100');
      }, 10);
    });

    function closeQr() {
      qrModal.classList.add('opacity-0');
      qrCard.classList.remove('scale-100');
      qrCard.classList.add('scale-95');
      setTimeout(() => { qrModal.classList.add('hidden'); }, 300);
    }

    document.getElementById('close-qr').addEventListener('click', closeQr);
    qrModal.addEventListener('click', (e) => {
      if (e.target === qrModal) closeQr();
    });
  </script>
</body>
